<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no">

  <title>Mission CocoCombo</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


  <style>

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }


    /* =========================
       PANNEAU COMPACT
       ========================= */

    #panel {

      position: fixed;

      z-index: 9999;

      bottom: 6px;
      left: 5px;
      right: 5px;

      background: rgba(255,255,255,0.90);

      border-radius: 14px;

      padding: 5px 3px;

      text-align: center;

      box-sizing: border-box;

    }


    #title {

      font-size: 13px;

      font-weight: bold;

      color: #08783e;

      margin-bottom: 3px;

    }


    .controls {

      display: flex;

      justify-content: center;

      align-items: center;

      gap: 3px;

      width: 100%;

      box-sizing: border-box;

      margin: 2px 0;

    }


    button {

      height: 34px;

      min-width: 0;

      padding: 2px 7px;

      font-size: 16px;

      border: 1px solid #777;

      border-radius: 7px;

      background: white;

      touch-action: none;

      flex-shrink: 1;

    }


    button:active {

      background: #dff4e7;

    }


    .smallText {

      font-size: 11px;

      font-weight: bold;

    }


    #rotationMode {

      font-size: 11px;

      min-width: 75px;

    }


    #successButton {

      background: #148447;

      color: white;

      border: none;

      font-weight: bold;

      padding-left: 12px;
      padding-right: 12px;

    }


    /* =========================
       MESSAGE FINAL
       ========================= */

    #success {

      display: none;

      position: fixed;

      z-index: 10000;

      top: 10px;
      left: 50%;

      transform: translateX(-50%);

      width: 80%;

      max-width: 400px;

      background: rgba(255,255,255,0.92);

      padding: 10px;

      border-radius: 14px;

      text-align: center;

    }


    #successTitle {

      font-size: 18px;

      font-weight: bold;

      color: #08783e;

    }


    #successText {

      font-size: 13px;

      margin: 5px;

    }


    #replayButton {

      font-size: 13px;

      height: 32px;

    }


  </style>

</head>


<body>


<!-- =========================
     COMMANDES
     ========================= -->


<div id="panel">


  <div id="title">

    🌿 Posez le toit végétalisé sur l'AMI !

  </div>



  <!-- LIGNE 1 : POSITION -->


  <div class="controls">


    <span class="smallText">
      Position
    </span>


    <button data-action="left">
      ⬅️
    </button>


    <button data-action="right">
      ➡️
    </button>


    <button data-action="up">
      ⬆️
    </button>


    <button data-action="down">
      ⬇️
    </button>


    <button data-action="forward">
      ＋
    </button>


    <button data-action="backward">
      －
    </button>


  </div>



  <!-- LIGNE 2 : ROTATION -->


  <div class="controls">


    <button
      id="rotationMode"
      onclick="changeRotationMode()">

      🔄 Tourner

    </button>


    <button data-action="rotminus">
      ↶
    </button>


    <button data-action="rotplus">
      ↷
    </button>


    <button data-action="smaller">
      🔎−
    </button>


    <button data-action="bigger">
      🔎+
    </button>


    <button
      id="successButton"
      onclick="missionComplete()">

      ✓

    </button>


  </div>


</div>



<!-- =========================
     MESSAGE DE RÉUSSITE
     ========================= -->


<div id="success">


  <div id="successTitle">

    🎉 Mission réussie !

  </div>


  <div id="successText">

    Vous avez végétalisé la Citroën AMI ! 🌿

  </div>


  <button
    id="replayButton"
    onclick="replay()">

    🔄 Rejouer

  </button>


</div>



<!-- =========================
     SCÈNE MINDAR
     ========================= -->


<a-scene

  mindar-image="
    imageTargetSrc: ./targets.mind;
    autoStart: true;
    filterMinCF: 0.001;
    filterBeta: 0.01;
    missCount: 20;
    warmupTolerance: 5;
    missTolerance: 5;
  "

  embedded

  color-space="sRGB"

  renderer="
    colorManagement: true;
    physicallyCorrectLights: true;
    alpha: true;
  "

  vr-mode-ui="enabled: false"

  device-orientation-permission-ui="enabled: false">


  <a-assets>


    <a-asset-item

      id="toit"

      src="./soil+block+planter+3d+model.glb">

    </a-asset-item>


  </a-assets>



  <a-camera

    position="0 0 0"

    look-controls="enabled: false">

  </a-camera>



  <a-entity

    mindar-image-target="targetIndex: 0">


    <a-entity id="roofContainer">


      <a-gltf-model

        src="#toit">

      </a-gltf-model>


    </a-entity>


  </a-entity>


</a-scene>



<script>


/* =========================
   VALEURS DE DÉPART
   ========================= */


let x = 0;

let y = 1.3;

let z = 0;


let scaleValue = 2;


let rx = 0;

let ry = 0;

let rz = 0;


let rotationMode = "Y";



/* =========================
   MISE À JOUR DU MODÈLE
   ========================= */


function updateModel() {


  const container =
    document.querySelector("#roofContainer");


  if (!container || !container.object3D) {

    return;

  }


  container.object3D.position.set(

    x,

    y,

    z

  );


  container.object3D.scale.set(

    scaleValue,

    scaleValue,

    scaleValue

  );


  container.object3D.rotation.set(

    THREE.MathUtils.degToRad(rx),

    THREE.MathUtils.degToRad(ry),

    THREE.MathUtils.degToRad(rz),

    "XYZ"

  );


}



/* =========================
   DÉPLACEMENT
   ========================= */


function move(dx,dy,dz) {


  x += dx;

  y += dy;

  z += dz;


  updateModel();


}



/* =========================
   TAILLE
   ========================= */


function resizeModel(factor) {


  scaleValue *= factor;


  updateModel();


}



/* =========================
   ROTATIONS
   ========================= */


function rotateX(angle) {


  rx += angle;

  updateModel();


}



function rotateY(angle) {


  ry += angle;

  updateModel();


}



function rotateZ(angle) {


  rz += angle;

  updateModel();


}



/* =========================
   CHOIX ROTATION
   ========================= */


function changeRotationMode() {


  const button =
    document.querySelector("#rotationMode");


  if (rotationMode === "Y") {


    rotationMode = "X";

    button.innerHTML =
      "↕️ Incliner";


  }


  else if (rotationMode === "X") {


    rotationMode = "Z";

    button.innerHTML =
      "↔️ Basculer";


  }


  else {


    rotationMode = "Y";

    button.innerHTML =
      "🔄 Tourner";


  }


}



/* =========================
   ROTATION ACTIVE
   ========================= */


function rotateCurrent(angle) {


  if (rotationMode === "X") {


    rotateX(angle);


  }


  else if (rotationMode === "Y") {


    rotateY(angle);


  }


  else {


    rotateZ(angle);


  }


}



/* =========================
   RESET
   ========================= */


function resetModel() {


  x = 0;

  y = 1.3;

  z = 0;


  scaleValue = 2;


  rx = 0;

  ry = 0;

  rz = 0;


  rotationMode = "Y";


  document.querySelector("#rotationMode").innerHTML =
    "🔄 Tourner";


  updateModel();


}



/* =========================
   MISSION RÉUSSIE
   ========================= */


function missionComplete() {


  document.querySelector("#panel").style.display =
    "none";


  document.querySelector("#success").style.display =
    "block";


}



/* =========================
   REJOUER
   ========================= */


function replay() {


  resetModel();


  document.querySelector("#success").style.display =
    "none";


  document.querySelector("#panel").style.display =
    "block";


}



/* =========================
   COMMANDES
   ========================= */


function performAction(action) {


  switch(action) {


    case "left":

      move(-0.05,0,0);

      break;


    case "right":

      move(0.05,0,0);

      break;


    case "up":

      move(0,0.05,0);

      break;


    case "down":

      move(0,-0.05,0);

      break;


    case "forward":

      move(0,0,0.05);

      break;


    case "backward":

      move(0,0,-0.05);

      break;


    case "rotminus":

      rotateCurrent(-2);

      break;


    case "rotplus":

      rotateCurrent(2);

      break;


    case "smaller":

      resizeModel(0.98);

      break;


    case "bigger":

      resizeModel(1.02);

      break;


  }


}



/* =========================
   APPUI PROLONGÉ
   ========================= */


let holdTimer = null;



function startHold(action) {


  stopHold();


  performAction(action);


  holdTimer =
    setInterval(

      function() {

        performAction(action);

      },

      100

    );


}



function stopHold() {


  if (holdTimer) {


    clearInterval(holdTimer);

    holdTimer = null;


  }


}



/* =========================
   ACTIVATION DES BOUTONS
   ========================= */


document
  .querySelectorAll("[data-action]")
  .forEach(function(button) {


    button.addEventListener(

      "pointerdown",

      function(event) {


        event.preventDefault();


        startHold(
          button.dataset.action
        );


      }

    );


    button.addEventListener(
      "pointerup",
      stopHold
    );


    button.addEventListener(
      "pointerleave",
      stopHold
    );


    button.addEventListener(
      "pointercancel",
      stopHold
    );


  });



document.addEventListener(

  "pointerup",

  stopHold

);



/* =========================
   INITIALISATION
   ========================= */


window.addEventListener(

  "load",

  function() {


    setTimeout(

      updateModel,

      1000

    );


  }

);


</script>


</body>

</html>
