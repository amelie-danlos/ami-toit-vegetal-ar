<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no">

  <title>Mission CocoCombo</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    /* =========================
       PANNEAU DE JEU
       ========================= */

    #panel {
      position: fixed;
      z-index: 9999;

      bottom: 5px;
      left: 4px;
      right: 4px;

      background: rgba(255,255,255,0.92);

      border-radius: 14px;

      padding: 5px;

      box-sizing: border-box;

      text-align: center;
    }

    #title {
      font-size: 14px;
      font-weight: bold;
      color: #08783e;

      margin-bottom: 4px;
    }

    .row {
      display: flex;
      justify-content: center;
      align-items: center;

      gap: 3px;

      margin: 3px 0;

      width: 100%;
    }

    .label {
      font-size: 10px;
      font-weight: bold;

      width: 42px;
      flex-shrink: 0;

      text-align: right;
      margin-right: 2px;
    }

    button {
      min-width: 0;

      height: 32px;

      padding: 2px 7px;

      font-size: 13px;

      border: 1px solid #666;
      border-radius: 7px;

      background: white;

      touch-action: none;
    }

    button:active {
      background: #dff4e7;
    }

    .moveButton {
      flex: 1;
      max-width: 50px;
    }

    .rotationButton {
      flex: 1;
      max-width: 55px;
    }

    .scaleButton {
      flex: 1;
      max-width: 70px;
    }

    #successButton {
      background: #16884b;
      color: white;

      border: none;

      font-weight: bold;

      flex: 1;

      max-width: 150px;
    }

    #resetButton {
      font-size: 11px;
      max-width: 90px;
    }

    /* =========================
       MESSAGE DE RÉUSSITE
       ========================= */

    #success {
      display: none;

      position: fixed;
      z-index: 10000;

      top: 15px;
      left: 50%;

      transform: translateX(-50%);

      width: 82%;
      max-width: 400px;

      box-sizing: border-box;

      padding: 12px;

      background: rgba(255,255,255,0.94);

      border-radius: 16px;

      text-align: center;
    }

    #successTitle {
      font-size: 20px;
      font-weight: bold;
      color: #08783e;
    }

    #successText {
      font-size: 14px;
      margin: 6px 0 10px 0;
    }

    #replayButton {
      font-size: 13px;
    }

  </style>

</head>


<body>


<!-- =========================
     PANNEAU DE COMMANDES
     ========================= -->

<div id="panel">

  <div id="title">
    🌿 Posez le toit végétalisé sur l'AMI !
  </div>


  <!-- DÉPLACEMENT -->

  <div class="row">

    <div class="label">
      POSITION
    </div>

    <button class="moveButton"
            data-action="left">
      ⬅️
    </button>

    <button class="moveButton"
            data-action="right">
      ➡️
    </button>

    <button class="moveButton"
            data-action="up">
      ⬆️
    </button>

    <button class="moveButton"
            data-action="down">
      ⬇️
    </button>

    <button class="moveButton"
            data-action="forward">
      AV
    </button>

    <button class="moveButton"
            data-action="backward">
      AR
    </button>

  </div>


  <!-- ROTATION X -->

  <div class="row">

    <div class="label">
      ROT X
    </div>

    <button class="rotationButton"
            data-action="xmin">
      X −
    </button>

    <button class="rotationButton"
            data-action="xplus">
      X +
    </button>


    <!-- ROTATION Y -->

    <div class="label">
      ROT Y
    </div>

    <button class="rotationButton"
            data-action="ymin">
      Y −
    </button>

    <button class="rotationButton"
            data-action="yplus">
      Y +
    </button>

  </div>


  <!-- ROTATION Z -->

  <div class="row">

    <div class="label">
      ROT Z
    </div>

    <button class="rotationButton"
            data-action="zmin">
      Z −
    </button>

    <button class="rotationButton"
            data-action="zplus">
      Z +
    </button>


    <div class="label">
      TAILLE
    </div>

    <button class="scaleButton"
            data-action="smaller">
      −
    </button>

    <button class="scaleButton"
            data-action="bigger">
      +
    </button>

  </div>


  <!-- FIN DU JEU -->

  <div class="row">

    <button id="resetButton"
            onclick="resetModel()">
      ↺ Recommencer
    </button>

    <button id="successButton"
            onclick="missionComplete()">
      ✓ TOIT POSÉ !
    </button>

  </div>

</div>


<!-- =========================
     MESSAGE DE RÉUSSITE
     ========================= -->

<div id="success">

  <div id="successTitle">
    🎉 Mission réussie !
  </div>

  <div id="successText">
    Vous avez posé le toit végétalisé sur la Citroën AMI ! 🌿
  </div>

  <button id="replayButton"
          onclick="replay()">
    🔄 Rejouer
  </button>

</div>


<!-- =========================
     SCÈNE AR
     ========================= -->

<a-scene

  mindar-image="
    imageTargetSrc: ./targets.mind;
    autoStart: true;
    filterMinCF: 0.001;
    filterBeta: 0.01;
    missCount: 20;
    warmupTolerance: 5;
    missTolerance: 5;
  "

  color-space="sRGB"

  renderer="
    colorManagement: true;
    physicallyCorrectLights: true;
  "

  vr-mode-ui="enabled: false"

  device-orientation-permission-ui="enabled: false">


  <!-- =========================
       MODÈLE 3D
       ========================= -->

  <a-assets>

    <a-asset-item
      id="toit"
      src="./soil+block+planter+3d+model.glb">
    </a-asset-item>

  </a-assets>


  <!-- =========================
       CAMÉRA
       ========================= -->

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>


  <!-- =========================
       CIBLE MINDAR
       ========================= -->

  <a-entity mindar-image-target="targetIndex: 0">


    <!--
      IMPORTANT :
      toutes les transformations sont
      appliquées au conteneur.
    -->

    <a-entity id="roofContainer">


      <a-gltf-model
        src="#toit">
      </a-gltf-model>


    </a-entity>


  </a-entity>


</a-scene>


<script>


/* =========================================
   POSITION INITIALE
   ========================================= */


let x = 0;
let y = 1.3;
let z = 0;


/* =========================================
   TAILLE
   ========================================= */


let scaleValue = 2;


/* =========================================
   TROIS ROTATIONS INDÉPENDANTES
   ========================================= */


let rx = 0;
let ry = 0;
let rz = 0;


/* =========================================
   MISE À JOUR DU MODÈLE
   ========================================= */


function updateModel() {

  const container =
    document.querySelector("#roofContainer");

  if (!container || !container.object3D) {
    return;
  }


  /* POSITION */

  container.object3D.position.set(
    x,
    y,
    z
  );


  /* TAILLE */

  container.object3D.scale.set(
    scaleValue,
    scaleValue,
    scaleValue
  );


  /* ROTATIONS X + Y + Z */

  container.object3D.rotation.set(

    THREE.MathUtils.degToRad(rx),

    THREE.MathUtils.degToRad(ry),

    THREE.MathUtils.degToRad(rz),

    "XYZ"

  );

}


/* =========================================
   DÉPLACEMENT
   ========================================= */


function move(dx, dy, dz) {

  x += dx;
  y += dy;
  z += dz;

  updateModel();

}


/* =========================================
   TAILLE
   ========================================= */


function resizeModel(factor) {

  scaleValue *= factor;

  updateModel();

}


/* =========================================
   ROTATION X
   ========================================= */


function rotateX(angle) {

  rx += angle;

  updateModel();

}


/* =========================================
   ROTATION Y
   ========================================= */


function rotateY(angle) {

  ry += angle;

  updateModel();

}


/* =========================================
   ROTATION Z
   ========================================= */


function rotateZ(angle) {

  rz += angle;

  updateModel();

}


/* =========================================
   REMISE À ZÉRO
   ========================================= */


function resetModel() {

  x = 0;
  y = 1.3;
  z = 0;

  scaleValue = 2;

  rx = 0;
  ry = 0;
  rz = 0;

  updateModel();

}


/* =========================================
   ACTIONS DES BOUTONS
   ========================================= */


function performAction(action) {

  switch(action) {


    /* POSITION */

    case "left":
      move(-0.05, 0, 0);
      break;

    case "right":
      move(0.05, 0, 0);
      break;

    case "up":
      move(0, 0.05, 0);
      break;

    case "down":
      move(0, -0.05, 0);
      break;

    case "forward":
      move(0, 0, 0.05);
      break;

    case "backward":
      move(0, 0, -0.05);
      break;


    /* ROTATION X */

    case "xmin":
      rotateX(-2);
      break;

    case "xplus":
      rotateX(2);
      break;


    /* ROTATION Y */

    case "ymin":
      rotateY(-2);
      break;

    case "yplus":
      rotateY(2);
      break;


    /* ROTATION Z */

    case "zmin":
      rotateZ(-2);
      break;

    case "zplus":
      rotateZ(2);
      break;


    /* TAILLE */

    case "smaller":
      resizeModel(0.98);
      break;

    case "bigger":
      resizeModel(1.02);
      break;

  }

}


/* =========================================
   APPUI PROLONGÉ
   ========================================= */


let holdTimer = null;


function startHold(action) {

  stopHold();

  performAction(action);

  holdTimer = setInterval(

    function() {

      performAction(action);

    },

    100

  );

}


function stopHold() {

  if (holdTimer !== null) {

    clearInterval(holdTimer);

    holdTimer = null;

  }

}


/* =========================================
   ACTIVATION DES BOUTONS
   ========================================= */


document
  .querySelectorAll("[data-action]")
  .forEach(function(button) {


    button.addEventListener(
      "pointerdown",
      function(event) {

        event.preventDefault();

        startHold(
          button.dataset.action
        );

      }
    );


    button.addEventListener(
      "pointerup",
      stopHold
    );


    button.addEventListener(
      "pointerleave",
      stopHold
    );


    button.addEventListener(
      "pointercancel",
      stopHold
    );


  });


document.addEventListener(
  "pointerup",
  stopHold
);


/* =========================================
   MISSION RÉUSSIE
   ========================================= */


function missionComplete() {

  stopHold();

  document.querySelector("#panel").style.display =
    "none";

  document.querySelector("#success").style.display =
    "block";

}


/* =========================================
   REJOUER
   ========================================= */


function replay() {

  resetModel();

  document.querySelector("#success").style.display =
    "none";

  document.querySelector("#panel").style.display =
    "block";

}


/* =========================================
   INITIALISATION
   ========================================= */


window.addEventListener(

  "load",

  function() {

    setTimeout(
      updateModel,
      1000
    );

  }

);


</script>

</body>

</html>
