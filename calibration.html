<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CocoCombo - Calibration AR</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #panel {
      position: fixed;
      z-index: 9999;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 94%;
      max-width: 520px;
      background: rgba(255,255,255,0.92);
      border-radius: 14px;
      padding: 8px;
      text-align: center;
    }

    #values {
      font-size: 12px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    .row {
      margin: 4px 0;
    }

    button {
      font-size: 14px;
      padding: 7px 10px;
      margin: 2px;
      border: 1px solid #555;
      border-radius: 8px;
      background: white;
    }
  </style>
</head>

<body>

<div id="panel">

  <div id="values"></div>

  <div class="row">
    POSITION HORIZONTALE<br>
    <button onclick="move(-0.1,0,0)">⬅️ Gauche</button>
    <button onclick="move(0.1,0,0)">Droite ➡️</button>
  </div>

  <div class="row">
    HAUTEUR<br>
    <button onclick="move(0,0.1,0)">⬆️ Monter</button>
    <button onclick="move(0,-0.1,0)">⬇️ Descendre</button>
  </div>

  <div class="row">
    PROFONDEUR<br>
    <button onclick="move(0,0,0.1)">➕ Avant</button>
    <button onclick="move(0,0,-0.1)">➖ Arrière</button>
  </div>

  <div class="row">
    TAILLE<br>
    <button onclick="resize(1.1)">➕ Agrandir</button>
    <button onclick="resize(0.9)">➖ Réduire</button>
  </div>

  div class="row">
  ROTATION X<br>
  <button onclick="rotateX(-5)">X −5°</button>
  <button onclick="rotateX(5)">X +5°</button>
</div>

<div class="row">
  ROTATION Y<br>
  <button onclick="rotateY(-5)">Y −5°</button>
  <button onclick="rotateY(5)">Y +5°</button>
</div>

<div class="row">
  ROTATION Z<br>
  <button onclick="rotateZ(-5)">Z −5°</button>
  <button onclick="rotateZ(5)">Z +5°</button>
</div>

  <div class="row">
    <button onclick="resetModel()">Réinitialiser</button>
  </div>

</div>

<a-scene
  mindar-image="
    imageTargetSrc: ./targets.mind;
    autoStart: true;
    filterMinCF: 0.001;
    filterBeta: 0.01;
    missCount: 20;
    warmupTolerance: 5;
    missTolerance: 5;
  "
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <a-asset-item
      id="toit"
      src="./soil+block+planter+3d+model.glb">
    </a-asset-item>
  </a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-entity mindar-image-target="targetIndex: 0">

    <a-gltf-model
      id="roof"
      src="#toit"
      position="0 1.3 0"
      rotation="0 0 0"
      scale="2 2 2">
    </a-gltf-model>

  </a-entity>

</a-scene>

<script>

let x = 0;
let y = 1.3;
let z = 0;
let scale = 2;
let rx = 0;
let ry = 0;
let rz = 0;

function updateModel() {

  const roof = document.querySelector("#roof");

  roof.setAttribute(
    "position",
    `${x} ${y} ${z}`
  );

  roof.setAttribute(
    "scale",
    `${scale} ${scale} ${scale}`
  );

  roof.setAttribute(
  "rotation",
  `${rx} ${ry} ${rz}`
);

  document.querySelector("#values").innerHTML =
  `X=${x.toFixed(2)} &nbsp;
   Y=${y.toFixed(2)} &nbsp;
   Z=${z.toFixed(2)} &nbsp;
   Taille=${scale.toFixed(2)}<br>
   RotX=${rx}° &nbsp;
   RotY=${ry}° &nbsp;
   RotZ=${rz}°`;
  
function move(dx,dy,dz) {
  x += dx;
  y += dy;
  z += dz;
  updateModel();
}

function resize(factor) {
  scale *= factor;
  updateModel();
}

function rotateX(angle) {
  rx += angle;
  updateModel();
}

function rotateY(angle) {
  ry += angle;
  updateModel();
}

function rotateZ(angle) {
  rz += angle;
  updateModel();
}

function resetModel() {
  x = 0;
  y = 1.3;
  z = 0;
  scale = 2;
  ry = 0;
  rx = 0;
  rz = 0;
  updateModel();
}

window.addEventListener("load", updateModel);

</script>

</body>
</html>
