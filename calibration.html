<title>CocoCombo - Calibration AR</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #panel {
      position: fixed;
      z-index: 9999;
      bottom: 5px;
      left: 50%;
      transform: translateX(-50%);
      width: 95%;
      max-width: 520px;
      background: rgba(255,255,255,0.92);
      border-radius: 12px;
      padding: 6px;
      text-align: center;
    }

    #values {
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .row {
      margin: 3px 0;
      font-size: 12px;
    }

    button {
      font-size: 13px;
      padding: 6px 9px;
      margin: 1px;
      border: 1px solid #555;
      border-radius: 7px;
      background: white;
    }
  </style>
</head>

<body>

<div id="panel">

  <div id="values">Chargement...</div>

  <div class="row">
    POSITION
    <button onclick="move(-0.1,0,0)">⬅️</button>
    <button onclick="move(0.1,0,0)">➡️</button>
  </div>

  <div class="row">
    HAUTEUR
    <button onclick="move(0,0.1,0)">⬆️</button>
    <button onclick="move(0,-0.1,0)">⬇️</button>
  </div>

  <div class="row">
    PROFONDEUR
    <button onclick="move(0,0,0.1)">Avant</button>
    <button onclick="move(0,0,-0.1)">Arrière</button>
  </div>

  <div class="row">
    TAILLE
    <button onclick="resizeModel(1.1)">＋</button>
    <button onclick="resizeModel(0.9)">－</button>
  </div>

  <div class="row">
    ROTATION X
    <button onclick="rotateX(-5)">−5°</button>
    <button onclick="rotateX(5)">+5°</button>
  </div>

  <div class="row">
    ROTATION Y
    <button onclick="rotateY(-5)">−5°</button>
    <button onclick="rotateY(5)">+5°</button>
  </div>

  <div class="row">
    ROTATION Z
    <button onclick="rotateZ(-5)">−5°</button>
    <button onclick="rotateZ(5)">+5°</button>
  </div>

  <div class="row">
    <button onclick="resetModel()">Réinitialiser</button>
  </div>

</div>


<a-scene
  mindar-image="
    imageTargetSrc: ./targets.mind;
    autoStart: true;
    filterMinCF: 0.001;
    filterBeta: 0.01;
    missCount: 20;
    warmupTolerance: 5;
    missTolerance: 5;
  "
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>

    <a-asset-item
      id="toit"
      src="./soil+block+planter+3d+model.glb">
    </a-asset-item>

  </a-assets>


  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>


  <a-entity mindar-image-target="targetIndex: 0">

    <!--
      Le conteneur reçoit les transformations.
      Le GLB reste à l'intérieur sans transformation.
    -->

    <a-entity id="roofContainer">

      <a-gltf-model
        src="#toit">
      </a-gltf-model>

    </a-entity>

  </a-entity>

</a-scene>


<script>

  // ----------------------------
  // VALEURS DE CALIBRATION
  // ----------------------------

  let x = 0;
  let y = 1.3;
  let z = 0;

  let scaleValue = 2;

  let rx = 0;
  let ry = 0;
  let rz = 0;


  // ----------------------------
  // MISE À JOUR DU MODÈLE
  // ----------------------------

  function updateModel() {

    const container =
      document.querySelector("#roofContainer");

    if (!container || !container.object3D) {
      return;
    }

    // Position
    container.object3D.position.set(
      x,
      y,
      z
    );

    // Taille
    container.object3D.scale.set(
      scaleValue,
      scaleValue,
      scaleValue
    );

    // Rotation en radians
    container.object3D.rotation.set(
      THREE.MathUtils.degToRad(rx),
      THREE.MathUtils.degToRad(ry),
      THREE.MathUtils.degToRad(rz),
      "XYZ"
    );

    // Affichage des valeurs
    document.querySelector("#values").innerHTML =
      `X=${x.toFixed(2)} &nbsp;
       Y=${y.toFixed(2)} &nbsp;
       Z=${z.toFixed(2)} &nbsp;
       Taille=${scaleValue.toFixed(2)}
       <br>
       RotX=${rx}° &nbsp;
       RotY=${ry}° &nbsp;
       RotZ=${rz}°`;
  }


  // ----------------------------
  // POSITION
  // ----------------------------

  function move(dx, dy, dz) {

    x += dx;
    y += dy;
    z += dz;

    updateModel();
  }


  // ----------------------------
  // TAILLE
  // ----------------------------

  function resizeModel(factor) {

    scaleValue *= factor;

    updateModel();
  }


  // ----------------------------
  // ROTATIONS
  // ----------------------------

  function rotateX(angle) {

    rx += angle;

    updateModel();
  }


  function rotateY(angle) {

    ry += angle;

    updateModel();
  }


  function rotateZ(angle) {

    rz += angle;

    updateModel();
  }


  // ----------------------------
  // RESET
  // ----------------------------

  function resetModel() {

    x = 0;
    y = 1.3;
    z = 0;

    scaleValue = 2;

    rx = 0;
    ry = 0;
    rz = 0;

    updateModel();
  }


  // Initialisation
  window.addEventListener(
    "load",
    function() {
      setTimeout(updateModel, 1000);
    }
  );

</script>

</body>
</html>
